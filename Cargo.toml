[package]
name = "mash"
version.workspace = true
edition = "2024"
description = "Multi-Agent Search History for local agent conversations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mashhq/mash"
# "mash" on crates.io is another crate; this one is installed from its releases.
publish = false
default-run = "mash"
autobins = false
autotests = false
autoexamples = false
autobenches = false

# `cargo binstall --git https://github.com/mashhq/mash mash` downloads the
# release archive instead of compiling ("mash" on crates.io is another crate).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mash-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# The desktop app is a workspace of its own, released at the same version:
# `cargo release replace` moves its manifest and lockfile with this package.
[package.metadata.release]
pre-release-replacements = [
  { file = "desktop/src-tauri/Cargo.toml", search = '(?m)^version = "[^"]+"$', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "desktop/src-tauri/Cargo.lock", search = 'name = "mash-desktop"\nversion = "[^"]+"', replace = "name = \"mash-desktop\"\nversion = \"{{version}}\"", exactly = 1 },
]

[workspace.package]
version = "0.2.4"

[workspace]
members = ["app", "cli", "crates/mash-query", "crates/mash-fleet", "crates/mash-model", "crates/mash-silver", "crates/mash-storage", "crates/mash-search", "crates/mash-sync", "crates/mash-dash", "crates/mash-mcp", "crates/mash-server"]
default-members = [".", "app", "cli", "crates/mash-query", "crates/mash-fleet", "crates/mash-model", "crates/mash-silver", "crates/mash-storage", "crates/mash-search", "crates/mash-sync", "crates/mash-dash", "crates/mash-mcp", "crates/mash-server"]
resolver = "3"

# This package is only the two programs: `build.rs` stamps the commit into
# them, so every commit compiles it again, and it must stay a few lines over
# `mash-cli` (`cli/`), which holds the command lines themselves.
[[bin]]
name = "mash"
path = "cli/main.rs"
test = false

[[bin]]
name = "mash-server"
path = "cli/server_main.rs"
test = false

[[test]]
name = "cli_contract"
path = "cli/tests/cli_contract.rs"

[features]
console = ["mash-cli/console"]

[dependencies]
mash-cli = { path = "cli" }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
mash-app = { path = "app" }
mash-dash = { path = "crates/mash-dash" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util", "process"] }
mash-model = { path = "crates/mash-model", features = ["test-support"] }
tempfile = "3.27.0"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
blake3 = "1.8.5"
rusqlite = { version = "0.41.0", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
axum = { version = "0.8", features = ["ws"] }
walkdir = "2.5.0"
mash-silver = { path = "crates/mash-silver", features = ["test-support"] }
tonic-prost = "0.14.9"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
ort = { version = "2.0.0-rc.13", default-features = false }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Dependencies keep file and line numbers for backtraces but not full debug
# info: it made each debug executable about a quarter larger, and a full test
# build links several of them. Mash's own crates keep the default.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
codegen-units = 16
# Keep symbol names so a stuck or crashed process can be diagnosed with
# gdb or a backtrace; debug info stays stripped to keep the binary small.
strip = "debuginfo"
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"
