  <!-- The Mash lockup: the blue-tile mark beside the lowercase wordmark in
       Geist, whose full stop is the pat of butter. The letters are outlines,
       so the logo looks the same wherever it is shown; the wordmark is mid-grey
       so it reads on light and dark pages alike. -->
