<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mash">
  <!-- The Mash logo: a scoop of mash with a pat of butter, on a blue tile. -->
  <rect width="64" height="64" rx="14" fill="#2f6bc4" />
  <!-- The scoop fills three quarters of the tile: scaled up 1.2 times about its centre. -->
  <g transform="translate(32 32) scale(1.2) translate(-32 -32.75)">
    <path d="M14 44c-2-12 8-20 18-20s20 8 18 20z" fill="#fff6dc" />
    <path
      d="M22 36c4-4 12-5 18-1"
      fill="none"
      stroke="#f4a583"
      stroke-width="3"
      stroke-linecap="round"
    />
    <rect
      x="26"
      y="15"
      width="13"
      height="11"
      rx="2.5"
      fill="#ffd34e"
      stroke="#ee7b3a"
      stroke-width="2.5"
      transform="rotate(-12 32 20)"
    />
    <rect x="12" y="46" width="40" height="6" rx="3" fill="#ee7b3a" />
  </g>
</svg>
