[package]
name = "mash-desktop"
version = "0.3.1"
edition = "2024"
description = "The Mash desktop app: the Mash dashboard in its own window"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mashhq/mash"
publish = false

# The app builds on its own, outside the Mash workspace, so the CLI's build,
# lock file and dependency checks never need a webview toolkit.
[workspace]

[lib]
name = "mash_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon: the menu bar icon; image-png: its picture; macos-private-api: a
# clear window behind the search panel's rounded edge.
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.2"
# Native notices: where a download went, and the command-line tool's result.
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-global-shortcut = "=2.4.1"
# Self-update: checks a channel's latest.json, verifies the download against
# the public key in tauri.conf.json, and replaces the installed app.
tauri-plugin-updater = "=2.14.1"
# Reading GitHub's record of the latest release in a build that does not
# update itself: the updater's own HTTP client and TLS provider, named here
# only because the plugin does not hand them on. No features of their own.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Asking the engine to stop gently: SIGTERM, or Ctrl+C through its console.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The search panel's place on every Space on macOS (menubar.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

# Win32_System_Console: Ctrl+C for the engine. Win32_UI_WindowsAndMessaging:
# telling running programs that the user's PATH changed. windows-registry:
# reading and writing that PATH (the `mash` command, src/cli/windows.rs);
# Tauri already depends on both.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
strip = true
