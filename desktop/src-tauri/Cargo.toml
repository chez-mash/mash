[package]
name = "mash-desktop"
version = "0.1.1-alpha"
edition = "2024"
description = "The Mash desktop app: the Mash dashboard in its own window"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mashium/mash"
publish = false

# The app builds on its own, outside the Mash workspace, so the CLI's build,
# lock file and dependency checks never need a webview toolkit.
[workspace]

[lib]
name = "mash_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon: the menu bar icon; image-png: its picture; macos-private-api: a
# clear window behind the search panel's rounded edge.
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.2"
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-global-shortcut = "=2.4.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
