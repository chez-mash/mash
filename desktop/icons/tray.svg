<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The macOS menu bar icon: the Mash scoop in one colour, which macOS draws
       as a template image in the menu bar's own colour. The pat of butter is
       cut clear of the scoop by a gap, and the scoop has the mark's lumpy top
       and swirl, so the shape reads as mash rather than a bell. -->
  <defs>
    <mask id="scoop">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="23.5" y="11.5" width="17" height="12" rx="3" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round" transform="rotate(-12 32 17.5)"/>
      <path d="M19 38c5-4 15-5 22-1" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <path d="M9 45c-2-8 2-15 9-17 2-5 8-8 14-7 6-1 12 2 14 7 7 2 11 9 9 17z" fill="#000" mask="url(#scoop)"/>
  <rect x="23.5" y="11.5" width="17" height="12" rx="3" fill="#000" transform="rotate(-12 32 17.5)"/>
  <rect x="8" y="49" width="48" height="7" rx="3.5" fill="#000"/>
</svg>
