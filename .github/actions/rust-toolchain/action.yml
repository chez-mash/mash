# Kept in this repository so its workflows depend on no personal account.
name: Install the pinned Rust toolchain
description: >-
  Install the compiler rust-toolchain.toml pins, with the components it
  lists, so every workflow builds with the same one and the date is written
  in one place.

outputs:
  channel:
    description: The toolchain that was installed, for example nightly-2026-11-22.
    value: ${{ steps.pin.outputs.channel }}

runs:
  using: composite
  steps:
    - name: Read the pinned toolchain
      id: pin
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
        # A floating name would let the compiler change under a release.
        if ! [[ $channel =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "::error::rust-toolchain.toml must pin a dated nightly (nightly-YYYY-MM-DD); found '$channel'."
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ steps.pin.outputs.components }}
