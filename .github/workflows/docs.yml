name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', 'README.md', 'dashboard/**', 'tools/visual.sh', '.github/workflows/docs.yml']
  # A pull request and the merge queue have no path filter: the ruleset for
  # main requires this workflow's last job, and a workflow that does not start
  # reports nothing. The `changes` job skips the work instead.
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # A release adds packages to the apt repository; republish so they are served.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

# Publishing runs one at a time. A pull request and a merge queue group each
# have a group of their own, so validating one never waits behind a deploy.
concurrency:
  group: documentation-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || 'publish' }}
  cancel-in-progress: false

jobs:
  # Whether a pull request or a merge queue group can affect the website. Every
  # other event builds: a push to main is already filtered by path and must
  # build to publish, and a release or a manual run republishes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - id: changes
        uses: ./.github/actions/changes
        with:
          workflow: docs.yml

  build:
    needs: changes
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            site/pnpm-lock.yaml
            dashboard/pnpm-lock.yaml
      # The demo is the dashboard itself, built to answer from made-up history.
      - name: Build the dashboard demo
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo
      - name: Install and validate documentation
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm --silent translate-docs --status >> "$GITHUB_STEP_SUMMARY"
          pnpm lint
          # Unused files, exports, types and dependencies (knip.jsonc).
          pnpm knip
          pnpm check
          pnpm test
          pnpm build
          pnpm add-demo
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Preserve published apt repository
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages > "$RUNNER_TEMP/apt-branch"
          status=$?
          set -e
          case "$status" in
            0)
              git fetch --depth=1 origin gh-pages
              if git cat-file -e FETCH_HEAD:apt; then
                git archive FETCH_HEAD apt | tar -x -C site/dist
              else
                echo "::error::Existing gh-pages branch lacks apt; refusing to publish an incomplete artifact."
                exit 1
              fi
              ;;
            2) echo "No apt release has been published yet." ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  # Compares the site's main pages with their committed pictures
  # (site/visual/baselines), in the same Playwright container image the
  # pictures were taken in. It does not hold back publishing. See
  # docs/internal/verification.md, "Visual baselines".
  visual:
    needs: changes
    if: >-
      github.event_name != 'workflow_run' &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install the site's dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Compare the site with its baselines
        env:
          MASH_VISUAL_ENGINE: docker
        run: bash tools/visual.sh site
      # Expected, actual and difference pictures, and a report to open.
      - name: Keep the pictures that differ
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-visual-differences
          path: |
            site/visual/report
            site/visual/results
          if-no-files-found: ignore
          retention-days: 14

  # Only what is on main is published, never a pull request or a change still
  # in the merge queue.
  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation and apt files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # The one status the ruleset for main requires of this workflow, on a pull
  # request and in the merge queue: it passes when every job above passed or
  # was skipped because its files did not change. A job that is skipped never
  # reports a status of its own, so requiring this one cannot leave a change
  # waiting.
  required:
    name: docs / required
    needs: [changes, build, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, build, visual: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
