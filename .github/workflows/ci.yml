name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue's run of a change on top of main; see "The merge queue" in
  # docs/internal/development.md.
  merge_group:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated current main commit as a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger; full debug info bloats every test binary and
  # slows both compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: mash-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}
# queue-caches.yml compiles with a copy of these variables to fill the
# compiler cache `rust` reads. Change them in both places: the compiler cache
# keys on the flags, and a difference leaves `rust` compiling everything.

jobs:
  # Which areas this commit can affect. The jobs below are skipped when theirs
  # is untouched; the workflow itself always runs and concludes, because a
  # release requires a successful run for its exact commit.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - id: changes
        uses: ./.github/actions/changes
        with:
          workflow: ci.yml

  # Every area's source counts toward the line limit, so this runs for every
  # change rather than inside a job that a front-end change skips.
  file-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Keep source files within the 500-line limit and review growth past 450
        env:
          # Growth is measured from what the branch was before this push, or
          # from the base of a pull request or of a merge queue group. The
          # checkout holds one commit, so the base is fetched; a first push
          # has none and skips the review.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --quiet --depth=1 origin "$BASE" || true
            python3 tools/check_file_lines.py --against "$BASE"
          else
            python3 tools/check_file_lines.py
          fi
      - name: Keep the global stylesheets from growing
        run: python3 tools/check_css_budget.py

  protocol:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      # The task runner, at the version and checksum tools/install-just.sh pins.
      - name: Install pinned just
        run: |
          bash tools/install-just.sh "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Check bounded protocols and expected counterexamples
        env:
          # The runner context is only available in step-level expressions; a
          # job-level env entry makes the whole workflow invalid.
          MASH_PROTOCOL_ARTIFACTS: ${{ runner.temp }}/mash-protocol
        run: |
          just protocol-tools
          just DEV_RUN= protocol-check

  dependencies:
    # Licences, banned and wildcard dependencies, and where crates come from.
    # Security advisories change without a commit, so they have their own
    # workflow (dependencies.yml) and do not fail an unrelated push.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing is compiled here, and the workflow's compiler cache is not
      # installed in this job.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check bans licenses sources

  rust:
    # Cancel obsolete validation jobs on branches, without canceling an active
    # deployment. On main a run that has started finishes: with several pushes
    # an hour, canceling meant no commit was ever validated, and a release
    # needs a passing run for its exact commit. A newer push waits its turn and
    # replaces any run still waiting.
    # The reusable deploy workflow holds its own noncanceling lock and head gate.
    concurrency:
      group: mash-ci-rust-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MASH_TEST_QDRANT_URL: http://localhost:6333
      MASH_TEST_QDRANT_GRPC_URL: http://localhost:6334
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      # Saved on main by queue-caches.yml, as is what the compiler cache holds.
      - name: Restore Cargo cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          # After a change to Cargo.lock, until queue-caches.yml has saved the new set:
          # the previous one, and Cargo downloads the crates that changed.
          restore-keys: mash-${{ runner.os }}-cargo-sources-
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest,uv@0.12.1
          fallback: none
      - name: Build CLI for acceptance tests
        run: cargo build --locked --bin mash --bin mash-server
      - name: Verify plugin session recall hooks
        working-directory: plugins/mash/hooks
        run: |
          uv tool run --from ruff==0.15.20 ruff check .
          uv tool run --from ruff==0.15.20 ruff format --check .
          uv tool run --from ty==0.0.38 ty check .
          MASH_RECALL_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            python3 -m unittest discover -s tests
      - name: Walk a new user's first run on a fresh home
        run: python3 .github/scripts/first-run-smoke.py target/debug/mash
      - name: Index histories while their application writes them
        run: python3 .github/scripts/live-writer-smoke.py target/debug/mash
      - name: Verify history skill examples against Rust contracts
        env:
          MASH_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          MASH_SKILL_CARGO_RUN: run
          TMPDIR: ${{ runner.temp }}
        run: |
          if [[ "$MASH_CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]]; then
            git fetch origin "$MASH_CONTRACT_BASE" --depth=1
          fi
          bash tools/generate-history-skill.sh --check
          cargo nextest run --profile ci --locked --lib -E 'test(history_skill_)' --no-tests fail
      - run: cargo nextest run --profile ci
      - run: cargo test --doc
      - run: sccache --show-stats

  # Formatting, lints and the generated SQLite queries. Clippy shares nothing
  # it compiles with the builds and tests, so it runs beside them.
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      # Saved on main by queue-caches.yml, as is what the compiler cache holds.
      - name: Restore Cargo cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          # After a change to Cargo.lock, until queue-caches.yml has saved the new set:
          # the previous one, and Cargo downloads the crates that changed.
          restore-keys: mash-${{ runner.os }}-cargo-sources-
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - run: cargo fmt --check
      # The task runner, at the version and checksum tools/install-just.sh pins.
      - name: Install pinned just
        run: |
          bash tools/install-just.sh "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Install pinned sqlc release
        run: |
          mkdir -p "$RUNNER_TEMP/mash-sqlc"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz"
          printf '%s  %s\n' \
            497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354 \
            "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" -C "$RUNNER_TEMP/mash-sqlc"
          echo "$RUNNER_TEMP/mash-sqlc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mash-sqlc/sqlc" version
      - name: Verify generated SQLite queries
        run: just check-generated
      - run: cargo clippy --all-targets -- -D warnings
      - run: sccache --show-stats

  # The tests that need the installed models, and the ones that restart or
  # restore Qdrant. They are marked `ignored` and chosen by name, so they run
  # beside the main suite in `rust` instead of after it.
  rust-models:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MASH_TEST_QDRANT_URL: http://localhost:6333
      MASH_TEST_QDRANT_GRPC_URL: http://localhost:6334
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      # Saved on main by queue-caches.yml, as is what the compiler cache holds.
      - name: Restore Cargo cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          # After a change to Cargo.lock, until queue-caches.yml has saved the new set:
          # the previous one, and Cargo downloads the crates that changed.
          restore-keys: mash-${{ runner.os }}-cargo-sources-
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
          fallback: none
      # The deployment probe at the end starts this program; the tests before
      # it compile what they need themselves.
      - name: Build CLI for the deployment probe
        run: cargo build --locked --bin mash --bin mash-server
      - name: Configure explicit test model directory
        run: echo "MASH_TEST_MODELS_DIR=$RUNNER_TEMP/mash-test-models" >> "$GITHUB_ENV"
      - name: Restore installed test models
        id: model-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: mash-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/mash-search/src/semantic.rs', 'crates/mash-search/src/semantic/models.rs', 'crates/mash-search/src/semantic/models/assets.rs', 'crates/mash-search/src/semantic/models/downloads.rs', 'crates/mash-search/src/semantic/models/install.rs', 'crates/mash-search/src/semantic/models/generations.rs') }}
      - name: Explicitly install and smoke-test local models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          printf 'version = 1\n[providers]\n' > "$RUNNER_TEMP/mash-model-install.toml"
          cargo run --locked -- --config "$RUNNER_TEMP/mash-model-install.toml" --models-dir "$MASH_TEST_MODELS_DIR" models install
      - name: Verify real embedding, reranking, hybrid search and parallel retrieval
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(cli_forwards_shared_vector_overrides) or test(mcp_protocol_forwards_vector_overrides) or test(real_models_index_and_run_hybrid_search) or test(real_models_mcp_) or test(real_models_shared_context_failure) or test(real_models_thread_discovery_and_scoped_messages) or test(real_model_length_aware_batches_preserve_quantized_vectors) or test(query_focused_reranking_preserves_paraphrases_and_reveals_late_evidence) or test(small_rerank_batches_preserve_scores_and_document_indices) or test(cached_local_models_preserve_results_and_validate_changed_assets) or test(merged_search_requests_shared_candidates_while_local_sqlite_is_blocked) or test(labeled_synthetic_relevance_matrix)'
      # The Qdrant tests run in `rust`'s main nextest step, against that job's
      # Qdrant service; these are the ones that also need the installed models.
      - name: Verify Qdrant search that also needs the installed models
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E '(test(exact_mcp_search_bypasses_model_permits) or test(sdk_search_pages_continue) or test(sdk_compact_and_extended_output) or test(sdk_decision_workflow) or test(exact_core_shared_and_fallback) or test(local_candidates_use_the_shared_query_vector) or test(local_rich_filters_apply_before) or test(local_message_candidates_intersect) or test(lexical_views_rebuild_streams_mcp_progress)) or (test(qdrant)) or (test(status_with_completed_embeddings) or test(current_views_readiness) or test(exact_status_uses_lexical_certification) or test(status_with_completed_context_only) or test(explicit_empty_index_reports_ready) or test(export_imports_history_offline) or test(users_only_cli_index) or test(lexical_only_cli_indexes) or test(index_without_pending_embeddings) or test(incomplete_index_progress) or test(rejected_source_preserves_cli) or test(init_configures_registers_and_indexes) or test(local_destination_never_publishes)) or (test(exact_cli_thread_excerpts) or test(cli_search_pages_partition) or test(exact_cli_search_needs_no_models) or test(exact_search_requires_every_word_and_explains_an_empty_result) or test(cli_masks_archived_credentials) or test(output_redaction_can_be_turned_off) or test(private_spans_never_reach_silver) or test(core_retrieves_native_cursor_threads))'
      - name: Verify Qdrant restart and snapshot restoration
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: |
          cargo build --locked --bin mash --bin mash-server
          MASH_TEST_SERVER_BINARY="$PWD/target/debug/mash-server" \
            cargo nextest run --profile ci --run-ignored only --no-tests fail -j 1 \
              -E 'test(shared_backend_persisted_restart_contract) or test(shared_backend_snapshot_restore_preserves_silver_views_and_revision_guards) or test(shared_views_lost_without_backup_is_replayed_from_shared_silver)'
      - name: Verify direct deployment probe and explicit refresh
        run: |
          MASH_TEST_CLI_BINARY="$PWD/target/debug/mash" \
            cargo nextest run -p mash-fleet --profile ci --run-ignored only --no-tests fail \
              -E 'test(probe_checks_without_ingestion_and_refreshes_only_when_requested)'
      - name: Clean owned restart fixtures after test failure or timeout
        if: always()
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: >-
          docker ps -aq --filter "label=mash.test.owner=$MASH_TEST_RESTART_OWNER" |
          xargs --no-run-if-empty docker rm -f -v
      - run: sccache --show-stats
      - name: Save verified installed test models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  # The suites that test this repository's own scripts: deployment, the
  # pre-push check, worktrees, the fleet's Ansible policy, releasing. None of
  # them compiles Mash, so they run beside `rust` instead of adding their four
  # minutes to it.
  tooling:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mash is not compiled here, and the workflow's compiler cache is not
      # installed in this job.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      # The pre-push suite formats a Rust file with the toolchain the
      # repository names, and skips that case when rustfmt is missing.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: uv@0.12.1
          fallback: none
      - name: Verify deployment gate
        run: |
          python3 .github/scripts/test-deploy-gate.py
          python3 .github/scripts/test-deploy-credentials.py
      # The task runner, at the version and checksum tools/install-just.sh pins.
      - name: Install pinned just
        run: |
          bash tools/install-just.sh "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Verify development API deployment rollback
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-api.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-build.sh
          bash tools/test-pr-labels.sh
      - name: Verify the pre-push check, the worktree workflow and the justfile
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-pre-push.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-worktree.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-justfile.sh
      - name: Verify Ansible fleet policy and cross-session exclusion
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/mash-ansible-runtime
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-controller-environment.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-run-ansible.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-ansible.sh
      # The version tools/release.sh pins (its cargo_release_version), from
      # cargo-release's own release with a pinned checksum.
      - name: Install pinned cargo-release
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-release"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/crate-ci/cargo-release/releases/download/v1.1.7/cargo-release-v1.1.7-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/cargo-release/cargo-release.tar.gz"
          printf '%s  %s\n' \
            9e04ae8b068f52788ce301cabaf34c4b3f0c945793d02c88442b561073f6bdb1 \
            "$RUNNER_TEMP/cargo-release/cargo-release.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/cargo-release/cargo-release.tar.gz" -C "$RUNNER_TEMP/cargo-release" ./cargo-release
          echo "$RUNNER_TEMP/cargo-release" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-release/cargo-release" release --version
      - name: Verify the release script against a throwaway remote
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-release.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-updater-key.sh
      - name: Verify offline search evaluation and benchmark witnesses
        run: uv run --no-project python -m unittest discover -s tools -p 'test_*.py'

  # The one status the ruleset for main requires of this workflow, on a pull
  # request and in the merge queue: it passes when every job above passed or
  # was skipped because its files did not change. A job that is skipped never
  # reports a status of its own, so requiring this one cannot leave a change
  # waiting.
  required:
    name: ci / required
    needs: [changes, file-lines, protocol, dependencies, lint, rust, rust-models, tooling]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, file-lines, protocol, dependencies, lint, rust, rust-models, tooling: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  deploy:
    needs: [lint, rust, rust-models, tooling, protocol]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy == true
    uses: ./.github/workflows/deploy.yml
    with:
      release_requested: ${{ inputs.deploy == true }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
