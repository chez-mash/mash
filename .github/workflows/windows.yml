name: Windows

# Proves the stable binary builds, starts, sets up and searches on a
# native Windows runner, and that the library and CLI tests pass there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger. Full debug info makes MSVC write a large PDB
  # per binary, which slows both compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The lld that ships with Rust links several times faster than link.exe.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  # Every job compiles with stable. Without this, any `cargo` or `rustc` that
  # runs in the checkout without `+stable` installs the nightly toolchain
  # rust-toolchain.toml names (the cache action's `rustc -vV` did: 50 s on
  # x64), and the cache key would hold that nightly's version and change
  # whenever a new one came out.
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Whether this commit can affect the Rust build. The builds below are
  # skipped when it cannot; the workflow itself always runs and concludes,
  # because a release requires a successful run for its exact commit.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - id: changes
        uses: ./.github/actions/changes
        with:
          workflow: windows.yml

  # The programs: they build, start, and set up, search and export on a real
  # Windows profile. These steps write configuration and an index into the
  # runner's profile, which Mash's default paths would pick up, so the test
  # suites run in jobs of their own (`lib-tests`, `cli-tests`), on clean
  # profiles and side by side: in one job with this they took 10 of its 13
  # minutes, and `linux-import` waited for all of them.
  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MASH_TEST_QDRANT_URL: http://127.0.0.1:6333
      MASH_TEST_QDRANT_GRPC_URL: http://127.0.0.1:6334
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Check PowerShell installer without network or a real installation
        shell: pwsh
        run: ./tools/test-install-powershell.ps1
      - name: Check installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test-install-powershell.ps1
      - name: Check the Copilot plugin's PowerShell hook commands
        working-directory: plugins/mash/hooks
        run: python -m unittest discover -s tests -p "test_powershell.py" -v
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # The compiled dependencies, saved by the `warm` job on main; see there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-v2
          shared-key: x64
          cache-bin: false
          save-if: false
      # A debug build shares its dependencies with the test builds, which
      # nearly halves a cold run; release.yml builds the release binary on
      # Windows before publishing.
      - name: Build
        run: cargo +stable build --locked --bin mash --bin mash-server
      # A Windows without DirectML or Direct3D 12 must still run Mash on the
      # CPU, so neither library may be needed to start (cli/delay_load.c).
      - name: Check the programs start without DirectML
        run: python .github/scripts/check-windows-delay-load.py target/debug/mash.exe target/debug/mash-server.exe
      - name: Start disposable native Qdrant
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 start
      - name: Smoke
        run: .github/scripts/deploy-smoke target/debug/mash.exe "$GITHUB_SHA"
      # The runner is disposable, so its real profile stands in for a user's:
      # Windows resolves profile folders through the shell, not environment.
      - name: Init and search
        run: |
          projects="$(cygpath -u "$USERPROFILE")/.claude/projects/p"
          mkdir -p "$projects"
          printf '%s\n' '{"type":"user","sessionId":"s1","uuid":"m1","cwd":"C:/work","timestamp":"2026-10-28T09:00:00Z","message":{"role":"user","content":"windowsneedle schema"}}' \
            > "$projects/s1.jsonl"
          target/debug/mash.exe init --no-agents | tee init.json
          target/debug/mash.exe search windowsneedle --local | tee search.json
          grep -q '"chat_id":"s1"' search.json
      - name: MCP, upgrade while running, and hooks
        run: python .github/scripts/windows-smoke.py target/debug/mash.exe
      # Windows file sharing and SQLite locking differ most from Unix here.
      - name: Index histories while their application writes them
        run: python .github/scripts/live-writer-smoke.py target/debug/mash.exe
      - name: Export a Windows-recorded history
        run: python .github/scripts/portability-smoke.py export target/debug/mash.exe "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-export
          path: ${{ runner.temp }}/portable
          retention-days: 3
      - name: Show disposable Qdrant state after a failure
        if: failure()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 show
      - name: Stop disposable Qdrant
        if: always()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 stop

  # The library tests, in two halves: `count:N/2` deals the tests out in turn,
  # so the halves together are exactly the whole suite.
  lib-tests:
    name: lib-tests (${{ matrix.half }}/2)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    env:
      MASH_TEST_QDRANT_URL: http://127.0.0.1:6333
      MASH_TEST_QDRANT_GRPC_URL: http://127.0.0.1:6334
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # The compiled dependencies, saved by the `warm` job on main; see there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-v2
          shared-key: x64
          cache-bin: false
          save-if: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
      - name: Start disposable native Qdrant
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 start
      # nextest runs each test in its own process, as on Linux: tracing caches
      # callsite interest process-wide, so tests sharing one process can drop
      # each other's captured events. Test processes start Mash constantly, so
      # they keep the executable in place (no relocation).
      - name: Library tests
        env:
          MASH_KEEP_EXECUTABLE: "1"
          # Linux CI runs proptest's full 256 cases. Here each SQLite-backed
          # case is several times slower on NTFS, so a smaller sample checks
          # the platform without exceeding nextest's timeout.
          PROPTEST_CASES: "32"
        run: cargo +stable nextest run --profile ci --locked --lib --partition count:${{ matrix.half }}/2
      - name: Show disposable Qdrant state after a failure
        if: failure()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 show
      - name: Stop disposable Qdrant
        if: always()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 stop

  cli-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MASH_TEST_QDRANT_URL: http://127.0.0.1:6333
      MASH_TEST_QDRANT_GRPC_URL: http://127.0.0.1:6334
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # The compiled dependencies, saved by the `warm` job on main; see there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-v2
          shared-key: x64
          cache-bin: false
          save-if: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
      - name: Start disposable native Qdrant
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 start
      # Test processes start Mash constantly, so they keep the executable in
      # place (no relocation).
      - name: CLI contract tests
        env:
          MASH_KEEP_EXECUTABLE: "1"
        run: cargo +stable nextest run --profile ci --locked --test cli_contract
      - name: Show disposable Qdrant state after a failure
        if: failure()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 show
      - name: Stop disposable Qdrant
        if: always()
        shell: pwsh
        run: ./.github/scripts/windows-qdrant.ps1 stop

  # Windows on ARM (Snapdragon laptops and others) builds natively with the
  # release's own steps (build-binaries.yml): the dashboard built in, the
  # release profile, the smoke test and the DirectML check. The x64 build
  # otherwise runs there only under emulation.
  #
  # `cache: true` starts it from what the last build of main compiled
  # (queue-caches.yml saves that for every commit), so it compiles the crates
  # this change touched and the ones built on them; from the dependencies
  # alone it took eight and a half minutes. A release still compiles this
  # target from nothing.
  build-arm64:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      targets: '["aarch64-pc-windows-msvc"]'
      cache: true
      artifact-suffix: -check
      retention-days: 1

  # Qdrant has no Windows ARM build, so Mash installs the x64 one there;
  # it must start and answer under Windows 11's emulator.
  qdrant-arm64:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Run the x64 Qdrant under emulation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qdrant'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'qdrant.zip'
          Invoke-WebRequest 'https://github.com/qdrant/qdrant/releases/download/v1.20.0/qdrant-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6d13553584fd0411f00637519e293331ff0aa1fb79bd9e30db45839bb75de2be') {
            throw 'Qdrant archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $root
          $env:QDRANT__SERVICE__HOST = '127.0.0.1'
          $qdrant = Start-Process (Join-Path $root 'qdrant.exe') -WorkingDirectory $root -PassThru `
            -RedirectStandardOutput (Join-Path $root 'stdout.log') -RedirectStandardError (Join-Path $root 'stderr.log')
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($qdrant.HasExited) { Get-Content (Join-Path $root 'stderr.log') -Tail 40; throw 'Qdrant exited before readiness' }
              try {
                Invoke-RestMethod 'http://127.0.0.1:6333/readyz' -TimeoutSec 2 | Out-Null
                'Qdrant answers under emulation.'
                return
              } catch { Start-Sleep -Seconds 1 }
            }
            throw 'Qdrant did not become ready'
          } finally {
            Stop-Process -Id $qdrant.Id -Force -ErrorAction SilentlyContinue
          }

  # What Windows exported must import, search and display unchanged on Linux.
  linux-import:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Nothing is cached here: from nothing this build takes two minutes on
      # Linux, and restoring 450 MB of compiled dependencies saved half a
      # minute of that.
      - name: Build
        run: cargo +stable build --locked --bin mash --bin mash-server
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-export
          path: ${{ runner.temp }}/portable
      - name: Import, search and view the Windows history
        run: python3 .github/scripts/portability-smoke.py import target/debug/mash "$RUNNER_TEMP/portable"

  # Saves the compiled dependencies `build`, `lib-tests` and `cli-tests` start
  # from.
  #
  # Only a cache saved on main can be read by a merge queue group (a group
  # runs on a branch of its own, and what it saves there is lost with the
  # branch), and on main the jobs above are skipped for every commit the queue
  # already tested. So they never save, and this job, which runs only on main,
  # does: it asks whether the cache for this compiler and Cargo.lock exists
  # (about half a minute) and compiles and saves it when it does not, which is
  # after a change to Cargo.lock or a manifest and after a new stable Rust.
  # Until it has finished, the queue's runs start from the previous cache and
  # compile the dependencies that changed.
  #
  # It tests nothing, and its failure fails neither this workflow nor the
  # required check: the next push to main tries again.
  warm:
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # The key is the action's own hash of the compiler, Cargo.lock, the
      # manifests and this workflow's CARGO_* and RUST* variables, so only
      # the action can say whether that cache exists.
      - name: Ask whether this cache exists
        id: saved
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-v2
          shared-key: x64
          cache-bin: false
          lookup-only: true
          save-if: false
      # Starts from the previous cache when there is one, and saves when the
      # steps below succeeded: a cache is saved once under its key and never
      # again, so one from a build that stopped halfway would stay incomplete.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.saved.outputs.cache-hit != 'true'
        with:
          prefix-key: mash-windows-v2
          shared-key: x64
          cache-bin: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        if: steps.saved.outputs.cache-hit != 'true'
        with:
          tool: nextest
      - name: Compile what those jobs compile
        if: steps.saved.outputs.cache-hit != 'true'
        run: |
          cargo +stable build --locked --bin mash --bin mash-server
          cargo +stable nextest run --profile ci --locked --lib --no-run
          cargo +stable nextest run --profile ci --locked --test cli_contract --no-run

  # The one status the ruleset for main requires of this workflow, on a pull
  # request and in the merge queue: it passes when every job above passed or
  # was skipped because its files did not change. A job that is skipped never
  # reports a status of its own, so requiring this one cannot leave a change
  # waiting.
  required:
    name: windows / required
    needs: [changes, build, lib-tests, cli-tests, build-arm64, qdrant-arm64, linux-import]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, build, lib-tests, cli-tests, build-arm64, qdrant-arm64, linux-import: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
