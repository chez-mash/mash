name: Release check
run-name: Install checks for ${{ inputs.tag || github.event.workflow_run.head_branch }}

# Installs a published release on each platform using the documented commands.
# It runs after a tagged release. To repeat the checks manually:
#   gh workflow run release-check.yml -f tag=v0.1.0-alpha
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release tag to install and expect, for example v0.1.0-alpha
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  published:
    # Branch dispatches build artifacts or repair packages for an existing tag.
    # A tag push identifies the release whose version these jobs must find.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the tag has a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$TAG" != v[0-9]* ]] ||
             [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::A published release tag is required."
            exit 1
          fi

  installer:
    needs: published
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-26, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Install with the shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | MASH_VERSION="$TAG" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install with the PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MASH_VERSION = $env:TAG
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/install.ps1" | iex
          Join-Path $HOME '.local\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # The installer must choose the archive built for this machine: an
          # x64 program also starts on ARM64, emulated, so a wrong choice
          # would pass the version check below.
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64' } else { '8664' }
          foreach ($name in 'mash.exe', 'mash-server.exe') {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $HOME ".local\bin\$name"))
            $machine = '{0:X4}' -f [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
            if ($machine -ne $expected) { throw "$name is built for machine $machine; this runner needs $expected." }
          }
      - name: Run it
        shell: bash
        run: |
          [ "$(mash --version | tr -d '\r')" = "mash ${TAG#v}" ]
          [ "$(mash-server --version | tr -d '\r')" = "mash-server ${TAG#v}" ]
          mash status > status.json || true
          grep -q '"ready"' status.json

  homebrew:
    needs: published
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Install from the tap and run it
        run: |
          [ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install mashhq/tap/mash
          [ "$(mash --version)" = "mash ${TAG#v}" ]

  apt:
    needs: published
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install from the apt repository and run it
        shell: bash
        env:
          LC_ALL: C
        run: |
          curl -fsSL https://getmash.io/apt/mash-archive-keyring.gpg | sudo tee /usr/share/keyrings/mash-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/mash-archive-keyring.gpg] https://getmash.io/apt stable main" | sudo tee /etc/apt/sources.list.d/mash.list
          expected=${TAG#v}
          # Match the Debian spelling of prerelease versions in build-repo.sh.
          expected=${expected/-/\~}
          # Documentation deploys the signed apt index after Release completes.
          # Wait for apt to select the new version using normal signature checks.
          for attempt in {1..30}; do
            if sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/mash.list \
                -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 \
                -o APT::Update::Error-Mode=any -o Acquire::https::Timeout=10 update &&
                [ "$(apt-cache policy mash-cli | awk '/Candidate:/ { print $2 }')" = "$expected" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              apt-cache policy mash-cli
              echo "::error::apt did not offer mash-cli $expected before the package check timed out."
              exit 1
            fi
            sleep 20
          done
          sudo apt-get install -y mash-cli
          [ "$(mash --version)" = "mash ${TAG#v}" ]
          # The app's package depends on mash-cli at exactly its own version
          # and runs that package's mash, so the two always move together.
          # The desktop package pulls system libraries from Ubuntu's archive, and
          # the runner image's index of it is days old: refresh every source, or
          # apt asks for package files the archive has already replaced.
          sudo apt-get update
          sudo apt-get install -y mash-desktop
          [ "$(dpkg-query -W -f '${Version}' mash-desktop)" = "$expected" ]
          [ "$(dpkg-query -W -f '${Version}' mash-cli)" = "$expected" ]
          [ "$(dpkg -S /usr/bin/mash | cut -d: -f1)" = mash-cli ]
          test -x /usr/bin/mash-desktop

  scoop:
    needs: published
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install from the Scoop bucket and run it
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add mashhq "https://github.com/$env:GITHUB_REPOSITORY"
          scoop install mashhq/mash
          $version = (mash --version).Trim()
          if ($version -ne "mash $($env:TAG.TrimStart('v'))") { throw "unexpected version: $version" }

  # The manifests a maintainer submits to microsoft/winget-pkgs, filled from
  # the release's SHA256SUMS exactly as release.yml's winget job fills them.
  # After a release they come from the tagged commit. A manual run takes the
  # templates of the branch it is started from, which is how a change to
  # packaging/winget is tried against a published release.
  winget-manifests:
    needs: published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Render the winget manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          python3 packaging/render.py --winget "$TAG" dist/SHA256SUMS winget-manifests
          for manifest in winget-manifests/*/*.yaml; do
            echo "::group::$manifest"
            cat "$manifest"
            echo '::endgroup::'
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: winget-manifests
          path: winget-manifests
          if-no-files-found: error

  # Installs both packages with winget itself from those manifests, on x64
  # and on ARM64, the way Microsoft's validation of a submission does:
  # MashHQ.Mash, the desktop app's installer, then MashHQ.Mash.CLI, the
  # command-line programs. Every winget command has its own time limit, so
  # one that never returns fails with the processes it left running and
  # winget's logs, not with a cancelled job.
  winget:
    needs: winget-manifests
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      APP_MANIFESTS: ${{ github.workspace }}\winget-manifests\MashHQ.Mash
      CLI_MANIFESTS: ${{ github.workspace }}\winget-manifests\MashHQ.Mash.CLI
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: winget-manifests
          path: winget-manifests
      - name: Find winget
        timeout-minutes: 15
        run: |
          # Shared by the steps below: run one winget command with a time
          # limit, print what it wrote, and record how long it took.
          @'
          $ErrorActionPreference = 'Stop'
          function Invoke-Winget {
              param([Parameter(Mandatory)] [string[]] $Arguments, [int] $Minutes = 12, [string] $About = '')
              $output = Join-Path $env:RUNNER_TEMP ('winget-' + [Guid]::NewGuid().ToString('N'))
              $started = Get-Date
              $process = Start-Process -FilePath (Get-Command winget.exe).Source -ArgumentList $Arguments -NoNewWindow -PassThru `
                  -RedirectStandardOutput "$output.out" -RedirectStandardError "$output.err"
              $null = $process.Handle  # keeps the exit code readable after the process ends
              $finished = $process.WaitForExit($Minutes * 60 * 1000)
              $seconds = [int] ((Get-Date) - $started).TotalSeconds
              Get-Content -LiteralPath "$output.out", "$output.err" | Where-Object { $_.Trim() }
              $command = "winget $($Arguments[0])$(if ($About) { " ($About)" })"
              if (-not $finished) {
                  "| $command | still running after $Minutes minutes |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                  Write-Host "::group::Processes started since $command began"
                  Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $started.AddSeconds(-5) } |
                      Sort-Object CreationDate |
                      Format-Table ProcessId, ParentProcessId, CreationDate, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300
                  Write-Host '::endgroup::'
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  throw "$command did not finish within $Minutes minutes."
              }
              $process.WaitForExit()
              "| $command | ${seconds}s, exit code $($process.ExitCode) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Write-Host "$command took ${seconds}s and exited with $($process.ExitCode)."
              if ($process.ExitCode -ne 0) { throw ("$command failed with exit code {0} (0x{0:X8})." -f $process.ExitCode) }
          }
          # What a newly opened terminal would search: the PATH stored for
          # the machine and the user, not the one this job started with.
          function Get-FreshPath {
              @([Environment]::GetEnvironmentVariable('PATH', 'Machine'), [Environment]::GetEnvironmentVariable('PATH', 'User')) -join ';'
          }
          # The first value a manifest gives a field.
          function Get-ManifestValue {
              param([Parameter(Mandatory)] [string] $Path, [Parameter(Mandatory)] [string] $Name)
              $line = Select-String -LiteralPath $Path -Pattern "^\s*(?:- )?${Name}:\s*(.+?)\s*$" | Select-Object -First 1
              if (-not $line) { throw "$Path has no $Name." }
              $line.Matches[0].Groups[1].Value
          }
          # What Windows lists under Installed apps for the desktop app: every
          # Uninstall key, for the user or the machine, that names Mash.
          function Get-AppRegistration {
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                  Where-Object { $_.PSChildName -like '*Mash*' -or $_.DisplayName -like '*Mash*' }
          }
          # Everything the app's installer puts on the machine outside its
          # own directory: shortcuts and the mash:// link handler.
          function Get-AppTraces {
              @(
                  Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
                      ([Environment]::GetFolderPath('Desktop')), "$env:PUBLIC\Desktop" -Recurse -Filter 'Mash*' -ErrorAction SilentlyContinue |
                      ForEach-Object FullName
                  Get-Item 'HKCU:\Software\Classes\mash', 'HKLM:\SOFTWARE\Classes\mash' -ErrorAction SilentlyContinue | ForEach-Object Name
              )
          }
          # PE machine type of a program: 8664 is x64, AA64 is ARM64.
          function Get-Machine {
              param([Parameter(Mandatory)] [string] $Path)
              $bytes = [IO.File]::ReadAllBytes($Path)
              '{0:X4}' -f [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          }
          # An NSIS uninstaller finishes in a copy of itself after winget's
          # command returns, so what it removes is waited for.
          function Assert-AppRemoved {
              param([string] $Directory)
              foreach ($attempt in 1..60) {
                  $left = @(
                      Get-AppRegistration | ForEach-Object PSPath
                      Get-AppTraces
                      if ($Directory -and (Test-Path -LiteralPath $Directory)) { $Directory }
                  )
                  if (-not $left) { Write-Host "Nothing of the app is left (checked after $($attempt * 2 - 2)s)."; return }
                  Start-Sleep -Seconds 2
              }
              if ($Directory -and (Test-Path -LiteralPath $Directory)) { Get-ChildItem -LiteralPath $Directory -Recurse -Force | ForEach-Object FullName }
              throw "winget uninstall left: $($left -join ', ')"
          }
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'winget-check.ps1') -Encoding utf8
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            # Microsoft's supported way to put App Installer on a machine
            # that lacks it.
            Write-Host 'winget is not on this runner image; installing App Installer.'
            Install-Module -Name Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -Latest -Force
            $env:PATH = "$env:LOCALAPPDATA\Microsoft\WindowsApps;$env:PATH"
            "$env:LOCALAPPDATA\Microsoft\WindowsApps" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
              throw 'This runner cannot run winget: App Installer could not be installed.'
            }
          }
          "### winget on $env:RUNNER_OS $env:RUNNER_ARCH`n`n| Step | Result |`n|---|---|" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Invoke-Winget -Arguments '--info' -Minutes 5
          # Whether the Visual C++ runtime both manifests depend on is already
          # here decides if the installs below also have to install it.
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\*' -ErrorAction SilentlyContinue |
              Format-Table PSChildName, Version, Installed, PSParentPath -AutoSize | Out-String -Width 300
      - name: Validate the manifests
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          Invoke-Winget -Arguments 'settings', '--enable', 'LocalManifestFiles' -Minutes 5
          Invoke-Winget -Arguments 'validate', '--manifest', $env:APP_MANIFESTS -Minutes 5 -About 'app'
          Invoke-Winget -Arguments 'validate', '--manifest', $env:CLI_MANIFESTS -Minutes 5 -About 'command line'
      # winget marks the installer it downloads as coming from the internet
      # and starts it through the shell, so SmartScreen checks it first. The
      # app's installer is not signed yet and has no reputation, so
      # SmartScreen holds it at "Windows protected your PC" until someone
      # clicks Run anyway, which nobody does on a runner: the install never
      # starts (run 45906719031). A user installing with winget sees that
      # prompt too. The command line's zip is unpacked by winget itself and
      # is not checked this way.
      - name: Turn off SmartScreen for the app's unsigned installer
        run: |
          $explorer = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
          $was = (Get-ItemProperty -LiteralPath $explorer -Name SmartScreenEnabled -ErrorAction SilentlyContinue).SmartScreenEnabled
          Set-ItemProperty -LiteralPath $explorer -Name SmartScreenEnabled -Value 'Off'
          New-Item -Path $policy -Force | Out-Null
          Set-ItemProperty -LiteralPath $policy -Name EnableSmartScreen -Value 0 -Type DWord
          "| SmartScreen | was '$(if ($was) { $was } else { 'default' })', turned off for the unsigned app installer |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Install the app with winget
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          $before = @(Get-AppRegistration | ForEach-Object PSPath) + @(Get-AppTraces)
          if ($before) { throw "This runner already has: $($before -join ', ')" }
          Invoke-Winget -Arguments 'install', '--manifest', $env:APP_MANIFESTS, '--accept-package-agreements',
              '--accept-source-agreements', '--silent', '--disable-interactivity', '--verbose-logs' -About 'app, silent'
      - name: Check the installed app
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          $version = $env:TAG.TrimStart('v')
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64' } else { '8664' }
          $manifest = Join-Path $env:APP_MANIFESTS 'MashHQ.Mash.installer.yaml'
          # What the installer registered, in full: the manifest's
          # ProductCode and AppsAndFeaturesEntries must say the same, or
          # winget cannot tell that the package is installed or upgrade it.
          $registered = @(Get-AppRegistration)
          $registered | Format-List * | Out-String -Width 300
          if ($registered.Count -ne 1) { throw "Expected one Uninstall key for the app, found $($registered.Count)." }
          $entry = $registered[0]
          $expected = [ordered] @{
            PSChildName    = Get-ManifestValue $manifest 'ProductCode'
            DisplayName    = Get-ManifestValue $manifest 'DisplayName'
            Publisher      = Get-ManifestValue $manifest 'Publisher'
            DisplayVersion = $version
          }
          foreach ($name in $expected.Keys) {
            if ($entry.$name -cne $expected[$name]) { throw "The installer registered $name '$($entry.$name)'; the manifest says '$($expected[$name])'." }
          }
          # Scope: user in the manifest.
          if ($entry.PSPath -notmatch 'HKEY_CURRENT_USER') { throw "The installer registered itself for the machine: $($entry.PSPath)" }
          "| app registration | key $($entry.PSChildName), DisplayName $($entry.DisplayName), Publisher $($entry.Publisher), DisplayVersion $($entry.DisplayVersion), per user |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $directory = $entry.InstallLocation.Trim('"')
          Get-ChildItem -LiteralPath $directory -Recurse | Format-Table Length, FullName -AutoSize | Out-String -Width 300
          foreach ($name in 'mash-desktop.exe', 'mash.exe', 'uninstall.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $directory $name))) { throw "$directory has no $name." }
          }
          # winget must have chosen the installer for this machine.
          foreach ($name in 'mash-desktop.exe', 'mash.exe') {
            $built = Get-Machine (Join-Path $directory $name)
            if ($built -ne $machine) { throw "$name is built for machine $built; this runner needs $machine." }
          }
          # The engine the app runs is the release's own.
          $reported = (& (Join-Path $directory 'mash.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -ne "mash $version") { throw "unexpected version from the app's engine: '$reported' (exit $LASTEXITCODE)" }
          "| app files | $directory, machine $machine, engine reports $reported |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Outside its directory: $((Get-AppTraces) -join ', ')"
          # A silent install must not leave the app or its engine running.
          Get-Process -Name 'mash*' -ErrorAction SilentlyContinue | Format-Table Id, Name, Path -AutoSize | Out-String -Width 300

          # Installed from a local manifest, the package is listed under an
          # identifier of its own and not as MashHQ.Mash from a source.
          $listed = Invoke-Winget -Arguments 'list', '--query', 'Mash', '--disable-interactivity' -Minutes 5
          $listed
          if (-not ($listed -match "Mash\s+\S*Mash\s+$([regex]::Escape($version))(\s|$)")) { throw "winget list does not show Mash $version." }
          "APP_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Uninstall the app with winget
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          Invoke-Winget -Arguments 'uninstall', '--manifest', $env:APP_MANIFESTS, '--silent', '--disable-interactivity', '--verbose-logs' -About 'app'
          Assert-AppRemoved -Directory $env:APP_DIRECTORY
      # Without --silent winget passes the manifest's SilentWithProgress
      # switch, which is what `winget install MashHQ.Mash` does for a user.
      - name: Install the app showing progress, then uninstall it
        timeout-minutes: 30
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          Invoke-Winget -Arguments 'install', '--manifest', $env:APP_MANIFESTS, '--accept-package-agreements',
              '--accept-source-agreements', '--disable-interactivity', '--verbose-logs' -About 'app, with progress'
          $entry = @(Get-AppRegistration)
          if ($entry.Count -ne 1 -or $entry[0].DisplayVersion -ne $env:TAG.TrimStart('v')) { throw 'The app is not registered after an install with progress.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:APP_DIRECTORY 'mash-desktop.exe'))) { throw "$env:APP_DIRECTORY has no mash-desktop.exe." }
          Invoke-Winget -Arguments 'uninstall', '--manifest', $env:APP_MANIFESTS, '--silent', '--disable-interactivity', '--verbose-logs' -About 'app'
          Assert-AppRemoved -Directory $env:APP_DIRECTORY
      - name: Install the command line with winget
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          Invoke-Winget -Arguments 'install', '--manifest', $env:CLI_MANIFESTS, '--accept-package-agreements',
              '--accept-source-agreements', '--silent', '--disable-interactivity', '--verbose-logs' -About 'command line'
      - name: Run the command line from a new shell
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          # winget puts a portable package's commands on PATH as links in its
          # Links directory, or by adding the package directory itself; either
          # way only the stored PATH changes, so resolve the commands there.
          $env:PATH = Get-FreshPath
          $version = $env:TAG.TrimStart('v')
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64' } else { '8664' }
          foreach ($name in 'mash', 'mash-server') {
            $command = Get-Command "$name.exe" -CommandType Application -ErrorAction Stop | Select-Object -First 1
            Write-Host "$name resolves to $($command.Source)"
            Get-Item -LiteralPath $command.Source | Format-List FullName, LinkType, Target | Out-String
            $reported = (& $command.Source --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $reported -ne "$name $version") { throw "unexpected version from ${name}: '$reported' (exit $LASTEXITCODE)" }
            # winget must have chosen the installer for this machine.
            $built = Get-Machine $command.Source
            if ($built -ne $machine) { throw "$name is built for machine $built; this runner needs $machine." }
            "| $name --version | $reported, machine $built, $($command.Source) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          # Installed from a local manifest, the package is listed under an
          # identifier of its own and not as MashHQ.Mash.CLI from a source.
          $listed = Invoke-Winget -Arguments 'list', '--query', 'Mash', '--disable-interactivity' -Minutes 5
          $listed
          if (-not ($listed -match "Mash CLI\s+.*\s$([regex]::Escape($version))(\s|$)")) { throw "winget list does not show Mash CLI $version." }
      - name: Uninstall the command line with winget
        timeout-minutes: 15
        run: |
          . (Join-Path $env:RUNNER_TEMP 'winget-check.ps1')
          Invoke-Winget -Arguments 'uninstall', '--manifest', $env:CLI_MANIFESTS, '--silent', '--disable-interactivity', '--verbose-logs' -About 'command line'
          $env:PATH = Get-FreshPath
          $left = Get-Command mash.exe, mash-server.exe -CommandType Application -ErrorAction SilentlyContinue
          if ($left) { throw "winget uninstall left $($left.Source -join ', ') on PATH." }
      - name: Collect winget's logs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'winget-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          # The packaged winget logs under its package directory; one
          # installed another way logs under the temporary directory.
          $directories = @(
            Get-Item "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_*\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue
            Get-Item "$env:TEMP\WinGet" -ErrorAction SilentlyContinue
          )
          Write-Host "winget log directories: $($directories.FullName -join ', ')"
          foreach ($directory in $directories) {
            Get-ChildItem -LiteralPath $directory.FullName -Recurse -File -Filter *.log | Copy-Item -Destination $logs -Force
          }
          Get-ChildItem $logs | Sort-Object LastWriteTime | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String
          Write-Host '::group::Processes still running from winget'
          Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match 'winget|WindowsPackageManager|AppInstaller|vc_?redist|msiexec|mash' } |
              Format-Table ProcessId, ParentProcessId, CreationDate, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300
          Write-Host '::endgroup::'
          foreach ($log in Get-ChildItem $logs -Filter '*.log' | Sort-Object LastWriteTime) {
            Write-Host "::group::$($log.Name) (last 80 lines)"
            Get-Content -LiteralPath $log.FullName -Tail 80
            Write-Host '::endgroup::'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: winget-logs-${{ matrix.runner }}
          path: ${{ runner.temp }}/winget-logs
          if-no-files-found: warn
