# Screenshots of the Mash desktop app on real Windows, without a VM: a
# GitHub-hosted Windows runner installs the x64 installer a Desktop run built,
# starts it in the runner's desktop session, and keeps the screenshots as an
# artifact (tools/win-vm/runner-shots.ps1). Run by hand with a Desktop run's id:
#   gh workflow run windows-shots.yml -f run=<id>
#   gh run download <this run> -n windows-shots
name: Windows screenshots

on:
  workflow_dispatch:
    inputs:
      run:
        description: The Desktop workflow run whose x64 installer to photograph
        required: true

permissions:
  actions: read
  contents: read

jobs:
  shots:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mash-desktop-x86_64-pc-windows-msvc
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
          path: installer
      - name: Install Mash, start it and take its screenshots
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem installer -Recurse -Filter *.exe | Select-Object -First 1 }
          tools/win-vm/runner-shots.ps1 -Installer $installer.FullName -Out shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-shots
          path: shots
