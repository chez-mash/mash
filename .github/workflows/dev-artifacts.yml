name: Dev artifacts

# Keeps installable release-profile builds of each main commit for two weeks,
# so `tools/fleet.sh deploy` can install them instead of compiling on every
# machine (see deployment/README.md). The builds are the release's own steps,
# unsigned, except that they start from what the last build on main compiled
# (`cache: true`) where a release compiles everything. Each artifact is named
# mash-<target>-<commit> and holds the archive with its .sha256.
#
# A commit that changes only the documentation, the website or the Raycast
# extension builds nothing; a deployment of such a commit compiles from source.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - site/**
      - raycast/**
  workflow_dispatch:

permissions:
  contents: read

# One build at a time. While one runs, only the newest waiting commit is kept,
# so a burst of landed commits builds the first and the last of them and the
# head of main always gets its artifacts. Each build starts from the compiled
# crates the one before it saved, which is why they do not run side by side:
# two at once would both start from the older cache and save over each other.
concurrency:
  group: dev-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      targets: >-
        ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin",
        "x86_64-pc-windows-msvc"]
      artifact-suffix: -${{ github.sha }}
      checksum: true
      retention-days: 14
      cache: true

  # Every build saves this repository's compiled crates under its own commit,
  # and a change to Cargo.lock saves the dependencies under a new key, here, in
  # queue-caches.yml and in windows.yml's `warm` job. Only the newest of each
  # is ever read again. The older ones are deleted here, so the
  # repository's 10 GB of cache is not spent on them and GitHub does not evict
  # caches the test workflows still use to make room.
  prune-caches:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the build caches a newer one has replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A family is one target's dependencies (the key ends with hashes
          # of the compiler and of Cargo.lock) or one target's crates (the key
          # ends with a hash of Cargo.lock and the commit). The list comes
          # newest first, so every key after the first of its family has been
          # replaced. `mash-windows-` holds the dependencies windows.yml's
          # `warm` job saves, named the same way.
          for prefix in mash-artifacts- mash-windows-; do
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/caches?key=$prefix&ref=refs/heads/main&sort=created_at&direction=desc&per_page=100" \
              --jq '.actions_caches[] | [.id, .key] | @tsv'
          done |
            awk -F '\t' '{
              family = $2
              sub(/-[^-]*-[^-]*$/, "", family)
              if (seen[family]++) print $1 "\t" $2
            }' > replaced.tsv
          while IFS=$'\t' read -r id key; do
            echo "Deleting $key"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" > /dev/null ||
              echo "::warning::Could not delete the cache $key"
          done < replaced.tsv
      # ci.yml's compiler cache (sccache) keeps one small cache for each
      # compiled crate, and its nightly compiler changes daily, which makes
      # every one saved before useless. GitHub would keep those for a week;
      # the ones nothing has read for two days go here. At most 400 a run, to
      # stay inside this token's hourly allowance of requests.
      - name: Delete compiler cache entries nothing reads any more
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/caches?key=sccache/&ref=refs/heads/main&sort=last_accessed_at&direction=asc&per_page=100" \
            --jq ".actions_caches[] | select(.last_accessed_at < \"$before\") | .id" > unread.txt
          echo "$(wc -l < unread.txt) entries were last read before $before"
          sed -n 1,400p unread.txt |
            xargs -r -P 4 -I{} gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/{}" > /dev/null ||
            echo "::warning::Could not delete some compiler cache entries"
      # A merge queue group runs on a branch of its own. What the test
      # workflows save there can be read only from that branch, which is
      # deleted when the group merges, and a group whose change touches
      # Cargo.lock or a manifest saves about 1.5 GB. Left alone those caches
      # are the most recently used ones in the repository, so GitHub evicts
      # caches that are still read to keep them.
      - name: Delete the caches of merge queue groups that have finished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | startswith("refs/heads/gh-readonly-queue/")) | [.id, .ref] | @tsv' > queue.tsv
          cut -f2 queue.tsv | sort -u | while read -r ref; do
            # A group still in the queue keeps its caches: a rerun reads them.
            # Only a 404 says the branch is gone.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/${ref#refs/}" > /dev/null 2> answer.txt; then continue; fi
            grep -q 'HTTP 404' answer.txt || { echo "::warning::Could not look up $ref"; continue; }
            echo "Deleting the caches of $ref"
            awk -F '\t' -v ref="$ref" '$2 == ref { print $1 }' queue.tsv | while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" > /dev/null ||
                echo "::warning::Could not delete cache $id of $ref"
            done
          done
