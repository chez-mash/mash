name: Release

# Tagging vX.Y.Z publishes prebuilt binaries for the commit CI validated, then
# updates this repository's Scoop bucket (no extra credential required).
# Each other package channel is updated when its credential is configured, and
# skipped otherwise: the Homebrew tap (HOMEBREW_TAP_TOKEN) and the signed apt
# repository on GitHub Pages (APT_GPG_PRIVATE_KEY).
# mise and cargo-binstall read the release assets directly. Releases build on
# stable Rust so they need no nightly features.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unvalidated:
        description: Build even though CI has not passed for this commit (artifacts only; never published)
        type: boolean
        default: false
      republish:
        description: A published release tag (for example v0.1.0-alpha) whose Homebrew and apt packages to publish again, without building
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validated:
    # Republishing package channels builds nothing, so it validates nothing.
    if: ${{ !inputs.republish }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI and Windows runs for this commit
        if: ${{ !inputs.allow_unvalidated }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml windows.yml; do
            conclusion=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$GITHUB_SHA" --status success --limit 1 --json conclusion \
              -q '.[0].conclusion // ""')
            if [ "$conclusion" != success ]; then
              echo "::error::$workflow has not passed for $GITHUB_SHA; releases ship validated commits only."
              exit 1
            fi
          done
      # A tag ahead of the version would publish binaries that call themselves
      # the release before, and the install checks after publishing would be
      # the first to notice. Stop before building instead.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Require the tag to match the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged=${GITHUB_REF_NAME#v}
          for manifest in Cargo.toml desktop/src-tauri/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest")
            if [ "$version" != "$tagged" ]; then
              echo "::error::$manifest is version $version, but the tag is $GITHUB_REF_NAME. Commit the version bump (\"Release $tagged\") before tagging."
              exit 1
            fi
          done

  build:
    needs: validated
    strategy:
      fail-fast: true
      matrix:
        include:
          # The Linux builds run in a glibc 2.34 image so the binaries load on
          # that release and later; see crates/mash-search/glibc_compat.c.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-26
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # `mash dash` serves pages embedded at compile time (see app/build.rs), so
      # they are built first and the compile fails without them.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build
        env:
          MASH_BUILD_REVISION: ${{ github.sha }}
          MASH_REQUIRE_DASHBOARD: 1
        run: cargo +stable build --release --locked --bin mash --bin mash-server
      - name: Check the glibc floor
        if: contains(matrix.target, 'linux')
        run: .github/scripts/check-glibc-floor 2.34 target/release/mash target/release/mash-server
      - name: Smoke
        run: |
          binary=target/release/mash
          [ -f "$binary.exe" ] && binary="$binary.exe"
          .github/scripts/deploy-smoke "$binary" "$GITHUB_SHA"
          server=target/release/mash-server
          [ -f "$server.exe" ] && server="$server.exe"
          "$server" --version
          "$server" --help
      # With the Apple secrets set, the Mac binaries are signed with the
      # hardened runtime and notarized, so macOS opens them without a warning.
      - name: Prepare Mac signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: .github/scripts/macos-signing-setup
      - name: Sign and notarize the Mac binaries
        if: runner.os == 'macOS' && env.MASH_SIGN == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for binary in target/release/mash target/release/mash-server; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict "$binary"
            .github/scripts/macos-notarize "$binary"
          done
      # With the Azure secrets set, the Windows programs are signed with Azure
      # Trusted Signing, so Windows names their publisher.
      - name: Sign the Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: .github/scripts/windows-sign.ps1 target/release/mash.exe target/release/mash-server.exe
      - name: Package
        run: |
          archive="mash-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd target/release && 7z a -tzip "$GITHUB_WORKSPACE/$archive" mash.exe mash-server.exe)
          else
            tar -C target/release -czf "$archive" mash mash-server
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  # The desktop app, which bundles the engine the build job made for the same
  # platform, so the app has the same compatibility floor as the archives.
  # Its installers are attached to the release under fixed names, so the
  # website can link to releases/latest/download/<name>. They are not signed
  # yet: macOS and Windows ask the person to confirm the first time they open
  # the app.
  desktop:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundle: appimage
            archive: tar.gz
            built: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            name: mash-desktop-linux-x86_64.AppImage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            bundle: appimage
            archive: tar.gz
            built: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            name: mash-desktop-linux-arm64.AppImage
          - target: aarch64-apple-darwin
            runner: macos-26
            bundle: dmg
            archive: tar.gz
            built: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            name: mash-desktop-macos-arm64.dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundle: nsis
            archive: zip
            built: desktop/src-tauri/target/release/bundle/nsis/*.exe
            name: mash-desktop-windows-x64-setup.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            bundle: nsis
            archive: zip
            built: desktop/src-tauri/target/release/bundle/nsis/*.exe
            name: mash-desktop-windows-arm64-setup.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install the webview toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mash-${{ matrix.target }}
          path: engine
      - name: Place the engine beside the app
        run: |
          cd engine
          if [ "${{ matrix.archive }}" = zip ]; then 7z x -y "mash-${{ matrix.target }}.zip" >/dev/null; else tar -xzf "mash-${{ matrix.target }}.tar.gz"; fi
          cd ..
          suffix=""
          [ "${{ runner.os }}" = Windows ] && suffix=.exe
          mkdir -p desktop/src-tauri/binaries
          cp "engine/mash$suffix" "desktop/src-tauri/binaries/mash-${{ matrix.target }}$suffix"
      - name: Prepare Mac signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: .github/scripts/macos-signing-setup
      # Tauri signs the app and its bundled engine with the hardened runtime
      # and notarizes the app when APPLE_SIGNING_IDENTITY and the API key are
      # set (by the step above); unset, it builds the app unsigned.
      - name: Build the installer
        working-directory: desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          pnpm install --frozen-lockfile
          sign=()
          # Tauri signs the app, its engine and the installer with this
          # command; without the Azure secrets the installer stays unsigned.
          if [ "${{ runner.os }}" = Windows ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            script="${GITHUB_WORKSPACE//\\//}/.github/scripts/windows-sign.ps1"
            sign=(--config "{\"bundle\":{\"windows\":{\"signCommand\":{\"cmd\":\"pwsh\",\"args\":[\"-NoProfile\",\"-File\",\"$script\",\"%1\"]}}}}")
          fi
          pnpm exec tauri build --ci --bundles ${{ matrix.bundle }} "${sign[@]}"
      - name: Name the installer
        run: |
          built=( ${{ matrix.built }} )
          [ "${#built[@]}" = 1 ] || { echo "expected one installer, found: ${built[*]}"; exit 1; }
          cp "${built[0]}" "${{ matrix.name }}"
      - name: Notarize the disk image
        if: runner.os == 'macOS' && env.MASH_SIGN == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${{ matrix.name }}"
          .github/scripts/macos-notarize "${{ matrix.name }}"
          spctl --assess --type open --context context:primary-signature --verbose "${{ matrix.name }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  provenance:
    needs: [build, desktop]
    # Branch dispatches exercise attestation on real builds. Only a tag push
    # can create attestations against a release tag.
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: mash-*
          path: dist
          merge-multiple: true
      - name: Attest the packaged archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mash-*

  publish:
    needs: provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: mash-*
          path: dist
          merge-multiple: true
      - name: Verify release archive provenance
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in mash-*; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum mash-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      # The package jobs below fill their manifests from these checksums.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
      - name: Update the Scoop bucket
        run: |
          python3 packaging/render.py "$GITHUB_REF_NAME" dist/SHA256SUMS \
            packaging/scoop/mash.json.in bucket/mash.json
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add bucket/mash.json
          git commit -m "Scoop: mash ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # winget manifests are rendered for a maintainer to submit to
  # microsoft/winget-pkgs (see packaging/winget/README.md); nothing is
  # submitted from here.
  winget:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.republish) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.republish || github.ref_name }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Render the winget manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          for template in packaging/winget/*.yaml.in; do
            name=$(basename "$template" .in)
            python3 packaging/render.py "$TAG" dist/SHA256SUMS "$template" "winget-manifests/$name"
          done
          cat winget-manifests/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: winget-manifests
          path: winget-manifests
          if-no-files-found: error

  # Each package channel is its own job, so one failing does not hold back the
  # other, and both can be run again for a release that is already published.
  homebrew:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.republish) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.republish || github.ref_name }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Update the Homebrew tap
        env:
          # A deploy key with write access to the tap alone; the token is the
          # older way and is used only when no key is set.
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAP_KEY" ]; then
            install -m 700 -d "$RUNNER_TEMP/tap-ssh"
            printf '%s\n' "$TAP_KEY" > "$RUNNER_TEMP/tap-ssh/key"
            chmod 600 "$RUNNER_TEMP/tap-ssh/key"
            export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            remote=git@github.com:grep-stack/homebrew-tap.git
          elif [ -n "$TAP_TOKEN" ]; then
            remote="https://x-access-token:${TAP_TOKEN}@github.com/grep-stack/homebrew-tap.git"
          else
            echo "Neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN is set; skipping the tap update."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          python3 packaging/render.py "$TAG" dist/SHA256SUMS \
            packaging/homebrew/mash.rb.in mash.rb
          git clone "$remote" tap
          mkdir -p tap/Formula
          cp mash.rb tap/Formula/mash.rb
          # The desktop app's cask, for releases that include its disk image.
          if grep -q ' mash-desktop-macos-arm64.dmg$' dist/SHA256SUMS; then
            mkdir -p tap/Casks
            python3 packaging/render.py "$TAG" dist/SHA256SUMS \
              packaging/homebrew/mash-desktop.rb.in tap/Casks/mash-desktop.rb
          fi
          cd tap
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add Formula/mash.rb
          if [ -f Casks/mash-desktop.rb ]; then git add Casks/mash-desktop.rb; fi
          if git diff --cached --quiet; then
            # Nothing to publish, but a credential that cannot push should
            # still fail here and not at the next release.
            git push --dry-run origin HEAD
            echo "The tap already has this formula, and this job can write to it."
            exit 0
          fi
          git commit -m "mash ${TAG}"
          git push origin HEAD

  apt:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.republish) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.republish || github.ref_name }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Publish .deb packages and the apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY is not set; skipping apt."
            exit 0
          fi
          # The release's own archives, so this also works long after the build.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'mash-*' --dir dist
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          # Outside the checkout: the repository has a `site` directory of its
          # own, the website's source, which must not end up on this branch.
          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$pages"
          else
            git init -b gh-pages "$pages"
            git -C "$pages" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # The branch holds the apt repository and nothing else.
          find "$pages" -mindepth 1 -maxdepth 1 ! -name .git ! -name apt -exec rm -rf {} +
          touch "$pages/.nojekyll"
          packaging/apt/build-repo.sh "$TAG" dist "$pages/apt"
          gh release upload "$TAG" dist/mash-cli_*.deb --repo "$GITHUB_REPOSITORY" --clobber
          cd "$pages"
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The apt repository already has this release."
            exit 0
          fi
          git commit -m "apt: mash-cli ${TAG}"
          git push origin gh-pages
