name: Desktop

# Build the Mash desktop app (desktop/) on each platform and keep its
# installers as artifacts. The app bundles the `mash` engine, so each job
# builds the dashboard and `mash` first, exactly as a release does, and places
# the engine beside the app as Tauri's sidecar. The installers are unsigned
# and published nowhere; signing and a download channel come later.
on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - dashboard/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - dashboard/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Like a release, the app and its engine build on stable Rust.
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install the webview toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the engine
        env:
          MASH_BUILD_REVISION: ${{ github.sha }}
          MASH_REQUIRE_DASHBOARD: 1
        run: cargo build --release --locked --bin mash
      - name: Place the engine beside the app
        run: |
          suffix=""
          [ "${{ runner.os }}" = Windows ] && suffix=.exe
          mkdir -p desktop/src-tauri/binaries
          cp "target/release/mash$suffix" "desktop/src-tauri/binaries/mash-${{ matrix.target }}$suffix"
      - name: Test the app
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build the installers
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --ci -- --locked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
