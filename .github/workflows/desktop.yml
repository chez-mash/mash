name: Desktop

# Build the Mash desktop app (desktop/) on each platform and keep its
# installers as artifacts. The app bundles the `mash` engine, so each job
# builds the dashboard and `mash` first, exactly as a release does, and places
# the engine beside the app as Tauri's sidecar.
#
# A build of main is also the app's `main` update channel: once the updater
# key exists (tools/updater-key.sh), the macOS and Linux builds are versioned
# as a prerelease of the next release (tools/desktop_updates.py), signed for
# the updater, and published as the rolling `main-channel` prerelease with
# the `latest.json` the app reads. The Mac app is signed with the Developer ID
# and notarized when the Apple secrets are set, as a release is, so an update
# keeps the identity macOS has granted permissions to. Without the key, or on
# a pull request, the installers are built as before and nothing is published.
#
# To take a bad build off the channel, run this workflow from main with
# `commit` set to the last good commit: it is built again under a higher
# build number, which every installed app then takes as its next update.
on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - dashboard/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - dashboard/**
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      commit:
        description: Build this commit of main instead of its tip (to replace a bad main-channel build with an earlier one)
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a pull request replaces its run. On main a run that has
# started finishes, so each landed commit keeps its own result.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Like a release, the app and its engine build on stable Rust.
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    # A pull request that `tools/worktree.sh land` opened only to queue it is
    # merged within minutes, and the push to main builds the same change.
    if: ${{ !contains(github.event.pull_request.body, '[merge queue]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine links a prebuilt ONNX Runtime that needs a newer C++
          # library than Ubuntu 22.04 has. Releases build it in a manylinux
          # image instead and the app reuses that engine.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      # A build of main that may be published to the main channel.
      CHANNEL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      # The engine is the program dev-artifacts.yml builds for every main
      # commit. On macOS and Windows this job compiles it on the same runner
      # image with the same settings, so it reads that workflow's two caches
      # (build-binaries.yml explains them; the keys and paths here must stay
      # the same as there) and saves nothing. On Linux that workflow builds in
      # another image, so the engine compiles from scratch here, as the app
      # itself does everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os != 'Linux'
        with:
          prefix-key: mash-artifacts-v1
          shared-key: ${{ matrix.target }}-release
          save-if: false
          cache-bin: false
      - name: Restore the engine's compiled crates
        if: runner.os != 'Linux'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            target/build-inputs.json
            target/release/deps/mash*
            target/release/deps/libmash*
            target/release/.fingerprint/mash*
            target/release/build/mash*
          key: mash-artifacts-crates-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: mash-artifacts-crates-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install the webview toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Mark the files that have not changed since the cached build
        if: runner.os != 'Linux'
        run: node .github/scripts/build-inputs.mjs restore target/build-inputs.json
      - name: Build the engine
        env:
          MASH_REQUIRE_DASHBOARD: 1
        run: MASH_BUILD_REVISION=$(git rev-parse HEAD) cargo build --release --locked --bin mash
      - name: Place the engine beside the app
        run: |
          suffix=""
          [ "${{ runner.os }}" = Windows ] && suffix=.exe
          mkdir -p desktop/src-tauri/binaries
          cp "target/release/mash$suffix" "desktop/src-tauri/binaries/mash-${{ matrix.target }}$suffix"
      - name: Test the app
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Prepare Mac signing
        if: runner.os == 'macOS' && env.CHANNEL == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: .github/scripts/macos-signing-setup
      # The updater replaces the app bundle on macOS and the AppImage on
      # Linux; the app leaves Windows and .deb installs alone, so only those
      # two are versioned and signed for the channel.
      - name: Decide whether this build is for the main channel
        id: channel
        if: env.CHANNEL == 'true' && runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          public=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$public" ]; then
            echo "::notice::The updater key is not set up (tools/updater-key.sh), so this build is not signed for updates and the main channel is not published."
            exit 0
          fi
          released=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml)
          version=$(python3 tools/desktop_updates.py main-version "$released" "$GITHUB_RUN_NUMBER")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Main channel build $version"
      - name: Build the installers
        working-directory: desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.channel.outputs.version && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.channel.outputs.version && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          CHANNEL_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          channel=()
          if [ -n "$CHANNEL_VERSION" ]; then
            channel=(--config "{\"version\":\"$CHANNEL_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}")
          fi
          # The test step above already holds Cargo to the lock file.
          pnpm exec tauri build --ci "${channel[@]}"
      - name: Name the update files
        if: steps.channel.outputs.version
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          mkdir update
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) from=$bundle/macos/Mash.app.tar.gz; to=mash-desktop-macos-arm64-$VERSION.app.tar.gz ;;
            x86_64-unknown-linux-gnu) from=$(ls $bundle/appimage/*.AppImage); to=mash-desktop-linux-x86_64-$VERSION.AppImage ;;
            aarch64-unknown-linux-gnu) from=$(ls $bundle/appimage/*.AppImage); to=mash-desktop-linux-arm64-$VERSION.AppImage ;;
          esac
          cp "$from" "update/$to"
          cp "$from.sig" "update/$to.sig"
          echo "$VERSION" > update/version-${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.channel.outputs.version
        with:
          name: desktop-update-${{ matrix.target }}
          path: update
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # The rolling prerelease the app's main channel reads. New files go up
  # under names that carry their version, then latest.json is replaced to
  # point at them, then the files of earlier builds are removed, so the
  # manifest never names a file that is not there.
  main-channel:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One publication at a time, in the order the runs were started.
    concurrency:
      group: desktop-main-channel
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: main-channel
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-update-*
          path: update
          merge-multiple: true
      - name: Publish the main channel
        run: |
          shopt -s nullglob
          versions=(update/version-*)
          if [ "${#versions[@]}" = 0 ]; then
            echo "::notice::No build was signed for updates (the updater key is not set up), so the main channel is unchanged."
            exit 0
          fi
          version=$(cat "${versions[0]}")
          rm update/version-*
          commit=$(git rev-parse HEAD)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # A run that was queued behind a newer one must not put its older
          # build back.
          published=$(curl -fsSL "$base/latest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"].rsplit(".", 1)[-1])' 2>/dev/null || echo 0)
          if [ "$published" -ge "$GITHUB_RUN_NUMBER" ]; then
            echo "::notice::The main channel already holds build $published; build $GITHUB_RUN_NUMBER is not published."
            exit 0
          fi
          python3 tools/desktop_updates.py manifest --version "$version" --base-url "$base" \
            --notes "Build $GITHUB_RUN_NUMBER of main, commit $commit." --output latest.json \
            "darwin-aarch64=$(echo update/mash-desktop-macos-arm64-*.app.tar.gz)" \
            "linux-x86_64=$(echo update/mash-desktop-linux-x86_64-*.AppImage)" \
            "linux-aarch64=$(echo update/mash-desktop-linux-arm64-*.AppImage)"
          rm update/*.sig
          notes="The newest build of the main branch, for the Mash app's Main update channel. It is replaced by every build; install a release instead unless you want that. This is build $GITHUB_RUN_NUMBER, version $version, commit $commit."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$commit" -F force=true >/dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$commit" --prerelease --latest=false \
              --title "Main channel" --notes "$notes"
          fi
          gh release upload "$TAG" update/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          keep=$(cd update && ls)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r asset; do
            [ "$asset" = latest.json ] || grep -qxF "$asset" <<<"$keep" || gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
          echo "Published $version to the main channel."
