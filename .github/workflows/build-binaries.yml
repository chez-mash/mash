name: Build binaries

# The one place that builds, smokes and packages `mash` and `mash-server` for
# each platform. A release calls it signed (release.yml); every main commit
# calls it unsigned to keep installable builds for the fleet
# (dev-artifacts.yml). Each target becomes one workflow artifact holding
# mash-<target>.tar.gz or .zip.
#
# A release compiles everything from scratch. The per-commit builds pass
# `cache: true` and start from what the last build on main compiled; see the
# cache steps below.
on:
  workflow_call:
    inputs:
      targets:
        description: JSON list of the target triples to build
        type: string
        default: >-
          ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin",
          "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
      sign:
        description: Sign the Mac and Windows programs when the signing secrets are set
        type: boolean
        default: false
      artifact-suffix:
        description: Appended to each artifact name (mash-<target><suffix>), for example -<commit>
        type: string
        default: ""
      checksum:
        description: Put <archive>.sha256 beside the archive in the artifact
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
      cache:
        description: >-
          Start from what the last build on main compiled. Off for a release,
          which must not depend on anything an earlier run left behind.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    # A matrix built from an input cannot carry per-target values, so the
    # runner and container are looked up by target here.
    # The Linux builds run in a glibc 2.34 image so the binaries load on
    # that release and later; see crates/mash-search/glibc_compat.c.
    runs-on: >-
      ${{ fromJSON('{
        "x86_64-unknown-linux-gnu": "ubuntu-latest",
        "aarch64-unknown-linux-gnu": "ubuntu-24.04-arm",
        "aarch64-apple-darwin": "macos-26",
        "x86_64-pc-windows-msvc": "windows-latest",
        "aarch64-pc-windows-msvc": "windows-11-arm"
      }')[matrix.target] }}
    container: >-
      ${{ fromJSON('{
        "x86_64-unknown-linux-gnu": "quay.io/pypa/manylinux_2_34_x86_64",
        "aarch64-unknown-linux-gnu": "quay.io/pypa/manylinux_2_34_aarch64"
      }')[matrix.target] }}
    timeout-minutes: 60
    env:
      ARCHIVE: mash-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}
      # This repository's compiled crates inside the target directory (every
      # package name starts with "mash"), and the record of the files they were
      # compiled from.
      WORKSPACE_CRATES: |
        target/build-inputs.json
        target/release/deps/mash*
        target/release/deps/libmash*
        target/release/.fingerprint/mash*
        target/release/build/mash*
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/rust-toolchain
      # The per-commit builds turn link-time optimization off. It is a third
      # of what compiling our own crates costs, and it buys the machines that
      # run these builds between releases a few percent. A release sets no
      # `cache`, skips this step and keeps the profile Cargo.toml gives; the
      # next step checks which of the two a build is about to get. This comes
      # before the cache steps because the key of the dependencies' cache
      # includes the CARGO_* variables, so the two kinds of build could not
      # share compiled objects even if a release read a cache.
      - name: Turn link-time optimization off for a per-commit build
        if: inputs.cache
        run: echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
      # Asks Cargo for the profile of every unit the build below compiles.
      # `"lto":"false"` is Cargo's name for the default a release uses
      # (optimizing across each crate's own code units) and `"off"` is none;
      # build scripts keep the default either way.
      - name: Check the profile this build compiles with
        env:
          KIND: ${{ inputs.cache && 'per-commit' || 'release' }}
        run: |
          found=$(cargo build --release --locked --bin mash --bin mash-server --unit-graph -Zunstable-options |
            grep -o '"lto":"[a-z-]*"' | sort -u | tr '\n' ' ')
          echo "$KIND build; link-time optimization in the units to compile: $found"
          case "$KIND:$found" in
            'release:"lto":"false" ') ;;
            'per-commit:"lto":"false" "lto":"off" ') ;;
            *)
              echo "::error::A release must compile every unit with Cargo.toml's profile (\"lto\":\"false\"), and a per-commit build its crates with \"lto\":\"off\"."
              exit 1 ;;
          esac
      # Two caches, because they change at different rates and the repository
      # has 10 GB for all of its caches.
      #
      # The first holds the compiled dependencies, about nine tenths of a
      # build from nothing. Its key changes only with Cargo.lock, a manifest
      # or the compiler, so most commits restore it and save nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.cache
        with:
          prefix-key: mash-artifacts-v1
          shared-key: ${{ matrix.target }}-release
          # A cold build takes 8 to 14 minutes; keep what a run built when it
          # failed after compiling (see the step after Build).
          cache-on-failure: true
          # Only main saves: a manual run on a branch reads main's cache and
          # leaves it as it was.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Nothing is installed with `cargo install` here.
          cache-bin: false
      # The second holds this repository's own compiled crates, which the
      # action above leaves out, and is saved for every commit on main
      # (dev-artifacts.yml deletes the older ones). With it a commit compiles
      # only the crates it changed and those built on them. A change to
      # Cargo.lock, to the pinned compiler (rust-toolchain.toml), to Cargo's
      # settings (.cargo/config.toml) or to this file, which sets the
      # profile, starts this cache again from nothing: these crates would be
      # compiled again anyway, under new file names, and the old files would
      # otherwise stay in the cache for good.
      - name: Restore this repository's compiled crates
        id: crates
        if: inputs.cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKSPACE_CRATES }}
          key: mash-artifacts-crates-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/build-binaries.yml') }}-${{ github.sha }}
          restore-keys: mash-artifacts-crates-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/build-binaries.yml') }}-
      # `mash dash` serves pages embedded at compile time (see crates/mash-dash/build.rs), so
      # they are built first and the compile fails without them.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Cargo compares file times, and a checkout stamps every file with now.
      # Files whose content is what the cached crates were compiled from get
      # their old time back, so only what this commit changed is compiled.
      # The cache steps never fail a build: without them it only takes longer.
      - name: Mark the files that have not changed since the cached build
        if: inputs.cache
        continue-on-error: true
        run: node .github/scripts/build-inputs.mjs restore target/build-inputs.json
      - name: Build
        id: build
        env:
          MASH_BUILD_REVISION: ${{ github.sha }}
          MASH_REQUIRE_DASHBOARD: 1
        run: cargo build --release --locked --bin mash --bin mash-server
      # A build that was cancelled or failed while compiling has only some of
      # the dependencies. Saved, that cache would never be completed, because
      # a later run finds its key and saves nothing: every build would compile
      # the missing dependencies and all of our crates built on them. This
      # happened on the first day, when one target's failure cancelled the
      # others in the middle of compiling.
      - name: Save no dependency cache from an unfinished build
        if: always() && inputs.cache && steps.build.outcome != 'success'
        run: echo "CACHE_ON_FAILURE=false" >> "$GITHUB_ENV"
      - name: Check the glibc floor
        if: contains(matrix.target, 'linux')
        run: .github/scripts/check-glibc-floor 2.34 target/release/mash target/release/mash-server
      - name: Check the programs start without DirectML
        if: contains(matrix.target, 'windows')
        run: python .github/scripts/check-windows-delay-load.py target/release/mash.exe target/release/mash-server.exe
      - name: Smoke
        run: |
          binary=target/release/mash
          [ -f "$binary.exe" ] && binary="$binary.exe"
          .github/scripts/deploy-smoke "$binary" "$GITHUB_SHA"
          server=target/release/mash-server
          [ -f "$server.exe" ] && server="$server.exe"
          "$server" --version
          "$server" --help
          # The program must report the commit it was built from: build.rs
          # stamps it and the entry points hand it to the library, and a
          # deployment checks it before it trusts an installation.
          "$binary" --version-info | grep -o "\"build\":\"$GITHUB_SHA\""
      # Saved once the binaries have passed the smoke check, under this
      # commit's name, so a run for the same commit restores exactly this.
      - name: Record the files this build was compiled from
        id: record
        if: inputs.cache && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node .github/scripts/build-inputs.mjs save target/build-inputs.json
      - name: Save this repository's compiled crates
        # A second run for one commit restored exactly this and has nothing new.
        if: steps.record.outcome == 'success' && steps.crates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKSPACE_CRATES }}
          key: mash-artifacts-crates-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/build-binaries.yml') }}-${{ github.sha }}
      # With the Apple secrets set, the Mac binaries are signed with the
      # hardened runtime and notarized, so macOS opens them without a warning.
      - name: Prepare Mac signing
        if: inputs.sign && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: .github/scripts/macos-signing-setup
      - name: Sign and notarize the Mac binaries
        if: inputs.sign && runner.os == 'macOS' && env.MASH_SIGN == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for binary in target/release/mash target/release/mash-server; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict "$binary"
            .github/scripts/macos-notarize "$binary"
          done
      # With the Azure secrets set, the Windows programs are signed with Azure
      # Trusted Signing, so Windows names their publisher.
      - name: Sign the Windows binaries
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: .github/scripts/windows-sign.ps1 target/release/mash.exe target/release/mash-server.exe
      - name: Package
        run: |
          mkdir packaged
          if [ "${ARCHIVE##*.}" = zip ]; then
            (cd target/release && 7z a -tzip "$GITHUB_WORKSPACE/packaged/$ARCHIVE" mash.exe mash-server.exe)
          else
            tar -C target/release -czf "packaged/$ARCHIVE" mash mash-server
          fi
      # The checksum is taken where the archive is made, so a download can be
      # checked against what this job built. shasum is the tool every runner has.
      - name: Record the archive's checksum
        if: inputs.checksum
        working-directory: packaged
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ARCHIVE"; else shasum -a 256 "$ARCHIVE"; fi > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-${{ matrix.target }}${{ inputs.artifact-suffix }}
          path: packaged/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
