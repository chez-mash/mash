name: Feature request
description: Something Mash does not do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Mash has a deliberately narrow scope: local agent chat history, searched
        through one CLI, one MCP server and one dashboard. Requests inside that
        scope are the ones most likely to be taken up.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where Mash gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you have in mind. A command or a sketch of the output helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
