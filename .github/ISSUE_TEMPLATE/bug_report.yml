name: Bug report
description: Something in Mash does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Remove private paths, addresses, chat text and
        credentials before sharing output. Use a made-up example if needed.
        [Report suspected vulnerabilities privately](https://github.com/mashhq/mash/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mash version
      description: Output of `mash --version` if available. If installation failed, share the error under What happened.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture and how you installed Mash.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Relevant diagnostic excerpt
      description: For setup or search problems, paste the relevant lines from `mash doctor` after removing private details.
      render: text
